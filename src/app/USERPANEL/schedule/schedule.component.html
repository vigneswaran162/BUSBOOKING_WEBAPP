<header class="ob-nav">
    <a class="ob-brand" href="/"><span class="ob-logo"><i class="fa-solid fa-bus"></i></span><span>Orange <b>Bus</b></span></a>
    <div class="ob-nav-tag"><i class="fa-solid fa-calendar-plus"></i> Schedule manager</div>
</header>

<main class="ob-wrap page">
    <div class="head ob-reveal">
        <h2><i class="fa-solid fa-calendar-plus"></i> Add bus <em>schedule</em></h2>
        <p>Fill in the bus, route and timing details, then submit.</p>
    </div>

    <div class="ob-card form-card ob-reveal" style="--d:.1s">
        <div class="grid">
            <section>
                <h3 class="ob-title"><i class="fa-solid fa-bus"></i> Bus <em>information</em></h3>
                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="ob-label">Schedule Id</label>
                    <input type="text" [(ngModel)]="model.ScheduleID" class="ob-input" id="exampleFormControlInput1">
                </div>
                <div class="mb-3">
                    <label for="inputGroupSelect03" class="ob-label">Vendor Id</label>
                    <select class="ob-input" id="inputGroupSelect03" [(ngModel)]="model.VendorID">

                        @for (option of VendorDetails; track option.VendorID) {
                        <option [value]="option.VendorID"> {{ option.VendorName }}</option>
                        }
                    </select>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlInput12" class="ob-label">Bus Name</label>
                    <input type="text" [(ngModel)]="model.BusName" class="ob-input" id="exampleFormControlInput12">
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlInput11" class="ob-label">Bus Vechicle No</label>
                    <input type="text" [(ngModel)]="model.BusVehicleNo" class="ob-input" id="exampleFormControlInput11">
                </div>
                <div class="two">
                    <div class="mb-3">
                        <label for="exampleFormControlInput10" class="ob-label">Total Seats</label>
                        <input type="text" [(ngModel)]="model.TotalSeats" class="ob-input" id="exampleFormControlInput10">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput7" class="ob-label">Available Seats</label>
                        <input type="text" class="ob-input" [(ngModel)]="model.AvailableSeats" id="exampleFormControlInput7">
                    </div>
                </div>
            </section>

            <section>
                <h3 class="ob-title"><i class="fa-solid fa-route"></i> Route &amp; <em>timing</em></h3>
                <div class="mb-3">
                    <label for="inputGroupSelect01" class="ob-label">From Location</label>
                    <select [(ngModel)]="model.FromLocation" class="ob-input" id="inputGroupSelect01">

                        @for (option of LocationDetails; track option.LocationCode) {
                        <option [value]="option.LocationCode">{{ option.LocationName }}</option>
                        }
                    </select>
                </div>
                <div class="mb-3">
                    <label for="inputGroupSelect02" class="ob-label">To Location</label>
                    <select [(ngModel)]="model.ToLocation" class="ob-input" id="inputGroupSelect02">

                        @for (option of LocationDetails; track option.LocationCode) {
                        <option [value]="option.LocationCode">{{ option.LocationName }}</option>
                        }
                    </select>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlInput2" class="ob-label">Schedule Date</label>
                    <input type="date" [(ngModel)]="model.ScheduleDate" class="ob-input" id="exampleFormControlInput2" [min]="currentDate">
                </div>
                <div class="two">
                    <div class="mb-3">
                        <label for="exampleFormControlInput3" class="ob-label">Depature Time</label>
                        <input type="time" [(ngModel)]="model.DepartureTime" class="ob-input" id="exampleFormControlInput3">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput4" class="ob-label">Arrival Time</label>
                        <input type="time" [(ngModel)]="model.ArrivalTime" class="ob-input" id="exampleFormControlInput4">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlInput5" class="ob-label">Price</label>
                    <input type="text" [(ngModel)]="model.Price" class="ob-input" id="exampleFormControlInput5">
                </div>
            </section>
        </div>

        <div class="co-md-8 actions">
            <button class="btn-1 ob-btn ghost mx-2">CLEAR</button>
            <button (click)="OnSubmit()" class="btn-2 ob-btn"><i class="fa-solid fa-paper-plane"></i> SUBMIT</button>
        </div>
    </div>
</main>
